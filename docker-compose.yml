services:
  db:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MARIADB_DATABASE: servisracunara
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - back-tier

  be:
    build: ./BE
    ports:
      - "8000:8000"
    volumes:
      - ./BE:/app
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      DB_NAME: servisracunara
    depends_on:
      - db
    networks:
      - front-tier
      - back-tier

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
    depends_on:
      - db
    networks:
      - back-tier

volumes:
  db-data:

networks:
  front-tier: {}
  back-tier: {}
